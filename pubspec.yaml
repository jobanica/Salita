name: salita
description: "Salita — daily Bible verse app for the Filipino market, built around a home-screen widget."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local storage (Drift / SQLite) — source of truth for content, bundled + seeded
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Home-screen widget bridge (Android now, iOS in Phase 3)
  home_widget: ^0.6.0

  # Background scheduling — daily 5 AM verse rotation + boot recovery
  workmanager: ^0.5.2

  # Deep linking: salita://verse/{verse_id}
  app_links: ^6.1.1

  # Typography (serif display for verses, sans for UI)
  google_fonts: ^6.2.1

  # Misc
  # Share images: render verse cards to PNG in-app (RepaintBoundary → image)
  # then hand the file to the OS share sheet.
  share_plus: ^9.0.0

  intl: ^0.19.0
  shared_preferences: ^2.2.3

  # NOTE: supabase_flutter and in_app_purchase are added in Phase 2.
  # Phase 1 is 100% offline and account-free by design.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift codegen
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

  # Riverpod codegen
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  # Fonts are pulled at build time via google_fonts (no bundled TTFs needed for MVP).
  # If you later want fully-offline fonts, bundle the TTFs here and switch off google_fonts runtime fetch.
